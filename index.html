<script>
(()=>{
'use strict';
const W=384,H=216,GROUND=204,GRAV=0.32;let WW=576;
// Rissa a 4: arena larga WW4, estesa in alto di EXT, con zoom tra ZMIN e 1. OFF = spostamento dell'arena originale dentro quella larga.
const WW4=864,EXT=150,OFF=144,ZMIN=0.6;let zoom=1,PLATS=[];
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(isTouch&&matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');
function resize(){
  const r=document.getElementById('wrap').getBoundingClientRect();
  const s=Math.max(1,Math.min(r.width/W,(r.height-8)/H));
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
}
addEventListener('resize',resize);resize();

/* ================= SCHERMO INTERO (telefono) =================
   Pulsante #fs: Fullscreen API dove esiste (Android, tablet); su iPhone Safari non c'e',
   quindi si spiega di aggiungere il gioco alla schermata Home (si apre gia' a schermo intero). */
(()=>{const b=document.getElementById('fs');if(!b)return;
  const el=document.documentElement,d=document;
  const standalone=matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches||navigator.standalone;
  if(standalone){b.style.display='none';return;}
  b.addEventListener('click',e=>{e.preventDefault();initAudio();
    if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return;}
    const req=el.requestFullscreen||el.webkitRequestFullscreen;
    if(req){Promise.resolve(req.call(el)).then(()=>{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}).catch(()=>{});}
    else{padMsg='IPHONE: CONDIVIDI > AGGIUNGI A HOME';padMsgT=300;}
  });
  const upd=()=>{b.textContent=(d.fullscreenElement||d.webkitFullscreenElement)?'\u2715':'\u26F6';setTimeout(resize,60);};
  addEventListener('fullscreenchange',upd);addEventListener('webkitfullscreenchange',upd);
})();

/* ================= INPUT ================= */
const keys={},prev={},buf={};
const BLOCK_KEYS=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'];
addEventListener('keydown',e=>{if(!keys[e.code])buf[e.code]=true;keys[e.code]=true;if(BLOCK_KEYS.includes(e.code))e.preventDefault();initAudio();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
const P1MAP={left:['KeyA'],right:['KeyD'],up:['KeyW'],down:['KeyS'],punch:['KeyF'],kick:['KeyG'],special:['KeyH']};
const P2MAP={left:['ArrowLeft'],right:['ArrowRight'],up:['ArrowUp'],down:['ArrowDown'],punch:['KeyK','Numpad1'],kick:['KeyL','Numpad2'],special:['Semicolon','Numpad3']};
// P3 e P4 esistono solo come joypad: codici virtuali scritti da pollPads
const padMap=n=>({left:['P'+n+'left'],right:['P'+n+'right'],up:['P'+n+'up'],down:['P'+n+'down'],punch:['P'+n+'punch'],kick:['P'+n+'kick'],special:['P'+n+'special']});
const P3MAP=padMap(3),P4MAP=padMap(4),PMAPS=[P1MAP,P2MAP,P3MAP,P4MAP];
const K_UP=['KeyW','ArrowUp','P3up','P4up'],K_DOWN=['KeyS','ArrowDown','P3down','P4down'],K_LEFT=['KeyA','ArrowLeft','P3left','P4left'],K_RIGHT=['KeyD','ArrowRight','P3right','P4right'];
/* Gamepad: il 1°-4° joypad collegato fanno da P1-P4 (P3 e P4 servono nella Rissa a 4). I pulsanti simulano i tasti della tastiera.
   Croce o levetta sinistra: movimento. A: pugno. B: calcio. X/Y/RB/RT: speciale.
   START: pausa in combattimento, conferma nei menu. SELECT/BACK: indietro (ESC), in pausa torna al menu (INVIO). */
const padHeld={};let padMsg='',padMsgT=0;
addEventListener('gamepadconnected',e=>{const n=padList().findIndex(g=>g.index===e.gamepad.index);padMsg=n>3?'JOYPAD EXTRA (IGNORATO)':'JOYPAD P'+(Math.max(0,n)+1)+' COLLEGATO';padMsgT=150;});
addEventListener('gamepaddisconnected',()=>{padMsg='JOYPAD SCOLLEGATO';padMsgT=150;});
function padList(){const out=[];const gs=navigator.getGamepads?navigator.getGamepads():[];for(const g of gs)if(g&&g.connected)out.push(g);return out;}
function pollPads(){
  const want={};
  padList().slice(0,4).forEach((g,i)=>{
    const m=PMAPS[i],b=n=>!!(g.buttons[n]&&(g.buttons[n].pressed||g.buttons[n].value>0.5));
    const ax=g.axes[0]||0,ay=g.axes[1]||0;
    const st={left:b(14)||ax<-0.5,right:b(15)||ax>0.5,up:b(12)||ay<-0.6,down:b(13)||ay>0.6,
      punch:b(0),kick:b(1),special:b(2)||b(3)||b(5)||b(7)};
    for(const k in st)if(st[k])want[m[k][0]]=true;
    if(b(9))want[mode==='fight'?'Escape':'Enter']=true;
    if((b(8)||b(1))&&mode==='fight'&&paused)want.Escape=true;
    else if(b(8)||(b(1)&&(mode==='options'||mode==='setup4'||mode==='select'||mode==='stage')))want.Escape=true;
  });
  let any=false;
  for(const c of new Set([...Object.keys(want),...Object.keys(padHeld)])){
    const on=!!want[c];
    if(on&&!padHeld[c]){buf[c]=true;keys[c]=true;any=true;}
    else if(!on&&padHeld[c])keys[c]=false;
    if(on)padHeld[c]=true;else delete padHeld[c];
  }
  if(any)initAudio();
}
const readPad=m=>{const o={};for(const k in m)o[k]=m[k].some(c=>keys[c]||buf[c]);return o;};
const hit=c=>(keys[c]||buf[c])&&!prev[c];
const anyHit=(...cs)=>cs.some(hit);
let tap=null;
{const pz=document.getElementById('pz');if(pz)pz.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();buf.Escape=true;});}
cv.addEventListener('pointerdown',e=>{initAudio();const r=cv.getBoundingClientRect();tap={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};});
document.querySelectorAll('#touch button').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();initAudio();if(!keys[k])buf[k]=true;keys[k]=true;b.classList.add('on');};
  const off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);
  b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);
});

/* ================= AUDIO ================= */
let AC=null,muted=false,NB=null;
function initAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});
  if(AC&&musicWant&&!music&&typeof playMusic==='function'&&musicWant!=='victory')playMusic(musicWant);
}
function tone(f,d,type='square',v=0.05,f2){
  if(!AC||muted)return;const t=AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+0.02);
}
function noise(d,v=0.15,freq=1200){
  if(!AC||muted)return;
  if(!NB){NB=AC.createBuffer(1,AC.sampleRate*0.7,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=NB;f.type='bandpass';f.frequency.value=freq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+d+0.02);
}
const SFX={
  whoosh:()=>noise(0.09,0.08,2600),
  punch:()=>{noise(0.08,0.28,900);tone(160,0.08,'square',0.05,60);},
  kick:()=>{noise(0.15,0.32,500);tone(110,0.15,'square',0.06,40);},
  block:()=>{tone(900,0.05,'square',0.04,600);noise(0.04,0.1,3000);},
  jump:()=>tone(220,0.12,'square',0.03,440),
  unto:()=>{tone(300,0.25,'sawtooth',0.04,80);noise(0.2,0.08,400);},
  cap:()=>tone(500,0.3,'triangle',0.05,900),
  toss:()=>tone(260,0.18,'triangle',0.05,520),
  boom:()=>{noise(0.7,0.45,160);tone(120,0.5,'sawtooth',0.07,30);},
  ko:()=>{tone(400,0.9,'sawtooth',0.07,40);noise(0.5,0.2,300);},
  sel:()=>tone(660,0.06,'square',0.04),
  ok:()=>{tone(523,0.08,'square',0.05);setTimeout(()=>tone(784,0.12,'square',0.05),80);},
  fight:()=>{tone(392,0.12,'square',0.06);setTimeout(()=>tone(523,0.12,'square',0.06),120);setTimeout(()=>tone(784,0.3,'square',0.06),240);}
};


/* ================= MUSIC ================= */
const NOTE={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const midiOf=n=>{const m=n.match(/^([A-G][#b]?)(\d)$/);return 12*(+m[2]+1)+NOTE[m[1]];};
const mf=m=>440*Math.pow(2,(m-69)/12);
const CHORDS={Am:['A','C','E'],G:['G','B','D'],F:['F','A','C'],E:['E','G#','B'],Dm:['D','F','A'],C:['C','E','G'],Bb:['Bb','D','F'],A:['A','C#','E']};
function chordMidis(name,oct){const ns=CHORDS[name];let base=midiOf(ns[0]+oct);const out=[base];for(let i=1;i<ns.length;i++){let m=midiOf(ns[i]+oct);while(m<=out[i-1])m+=12;out.push(m);}out.push(base+12);return out;}
const SONGS={
  title:{bpm:104,bass:'long',drums:'k . . . s . . . k . k . s . . h',bars:[
    ['Am','A4 - - - C5 - - - E5 - - - D5 - C5 -'],['F','C5 - - - A4 - - - F4 - - - A4 - C5 -'],
    ['C','E5 - - - G5 - - - C6 - - - B5 - G5 -'],['G','D5 - - - - - - - B4 - - - D5 - - -'],
    ['Am','A5 - - - G5 - E5 - C5 - - - E5 - - -'],['F','F5 - - - E5 - C5 - A4 - - - C5 - - -'],
    ['G','D5 - - - B4 - - - G4 - - - B4 - D5 -'],['E','E5 - - - - - - - G#4 - - - B4 - - -']]},
  barsport:{bpm:160,bass:'oct',drums:'k . h k s . h . k . h k s . h h',bars:[
    ['Am','E5 - A5 - C6 - B5 A5 - - G5 - A5 - - -'],['G','D5 - G5 - B5 - A5 G5 - - F5 - G5 - - -'],
    ['F','C5 - F5 - A5 - G5 F5 - - E5 - F5 - A5 -'],['E','G#5 - - - B5 - - - E6 - D6 - C6 - B5 -'],
    ['Am','A5 . A5 . C6 . E6 - D6 C6 B5 - C6 - A5 -'],['G','G5 . G5 . B5 . D6 - C6 B5 A5 - B5 - G5 -'],
    ['F','F5 . A5 . C6 - A5 - F5 - A5 - G5 - F5 -'],['E','E5 - G#5 - B5 - E6 - - - B5 - G#5 - E5 -']]},
  amnil:{bpm:132,bass:'rock',drums:'k . h . s . h . k . k h s . h .',bars:[
    ['Am','A4 - - - C5 - E5 - D5 - C5 - B4 - - -'],['Dm','D5 - - - F5 - A5 - G5 - F5 - E5 - - -'],
    ['E','E5 - G#5 - B5 - - - A5 - G#5 - E5 - - -'],['Am','A5 - - - E5 - - - C5 - D5 - E5 - - -'],
    ['F','F5 . F5 . A5 - C6 - B5 - A5 - F5 - - -'],['G','G5 . G5 . B5 - D6 - C6 - B5 - G5 - - -'],
    ['Dm','A5 - F5 - D5 - F5 - A5 - D6 - C6 - A5 -'],['E','B5 - - - G#5 - - - E5 - - - . . . .']]},
  spiaggetta:{bpm:140,bass:'oct',drums:'k . h . s . h k k . h . s . h h',bars:[
    ['C','E5 - G5 - C6 - - - B5 - A5 - G5 - - -'],['Am','A5 - C6 - E6 - - - D6 - C6 - A5 - - -'],
    ['F','F5 - A5 - C6 - A5 - G5 - F5 - E5 - - -'],['G','D5 - G5 - B5 - D6 - - - B5 - G5 - - -'],
    ['C','C6 . C6 . E6 - D6 - C6 - G5 - E5 - - -'],['Am','A5 . A5 . C6 - B5 - A5 - E5 - C5 - - -'],
    ['F','F5 - A5 - C6 - F6 - E6 - D6 - C6 - A5 -'],['G','G5 - B5 - D6 - - - G5 - - - . . . .']]},
  ceppo:{bpm:150,bass:'oct',drums:'k . h s k . h . k . h s k . h h',bars:[
    ['C','C5 - E5 - G5 - A5 G5 - - E5 - C5 - - -'],['F','F5 - A5 - C6 - D6 C6 - - A5 - F5 - - -'],
    ['C','E5 - G5 - C6 - E6 D6 - - C6 - G5 - E5 -'],['G','D5 - - - G5 - B5 - D6 - - - B5 - G5 -'],
    ['Am','A5 . A5 . C6 - A5 - E5 - G5 - A5 - - -'],['F','F5 . F5 . A5 - C6 - D6 - C6 - A5 - - -'],
    ['G','G5 - B5 - D6 - B5 - G5 - A5 - B5 - D6 -'],['C','C6 - - - G5 - E5 - C5 - - - . . . .']]},
  bayons:{bpm:168,bass:'rock',drums:'k . h . s . h . k k h . s . h s',bars:[
    ['Dm','D5 - - F5 - - A5 - G5 - F5 - E5 - D5 -'],['Bb','D5 - - F5 - - Bb5 - A5 - G5 - F5 - D5 -'],
    ['C','E5 - - G5 - - C6 - Bb5 - A5 - G5 - E5 -'],['A','C#5 - E5 - A5 - - - G5 - F5 - E5 - C#5 -'],
    ['Dm','A5 - A5 - D6 - - - C6 - A5 - F5 - G5 -'],['Bb','F5 - F5 - Bb5 - - - A5 - G5 - F5 - D5 -'],
    ['C','G5 - G5 - C6 - - - Bb5 - A5 - G5 - E5 -'],['A','A5 - - - E5 - - - C#6 - - - A5 - - -']]},
  victory:{bpm:150,bass:'long',loop:false,drums:'k . . . s . . . k . . . s . s s',bars:[
    ['C','C5 E5 G5 C6 - . G5 C6 - - - - . . . .'],['G','B5 - D6 - G6 - - - F6 - - - D6 - - -'],['C','E6 - - - - - - - - - - - . . . .']]}
};
SONGS.title.bars.forEach(b=>b[2]=b[1].split(' '));
for(const k in SONGS)SONGS[k].bars.forEach(b=>{b[2]=b[1].split(/\s+/);if(b[2].length!==16)console.warn('bar len',k,b[1]);});
let musicGain=null,music=null,musicWant=null,musicOn=true;
function ensureMusicGain(){if(AC&&!musicGain){musicGain=AC.createGain();musicGain.gain.value=0.55;musicGain.connect(AC.destination);}}
function mOsc(type,f,t,d,v,detune=0){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.detune.value=detune;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.008);g.gain.setValueAtTime(v,t+Math.max(0.01,d-0.04));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g).connect(musicGain);o.start(t);o.stop(t+d+0.02);}
function mNoise(t,d,v,freq,type){if(!NB){NB=AC.createBuffer(1,AC.sampleRate*0.7,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type=type;f.frequency.value=freq;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(f).connect(g).connect(musicGain);s.start(t,Math.random()*0.3);s.stop(t+d+0.02);}
function mKick(t){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+0.12);
  g.gain.setValueAtTime(0.32,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);o.connect(g).connect(musicGain);o.start(t);o.stop(t+0.16);}
function scheduleStep(m,t){
  const S=m.song,spb=60/S.bpm/4,bar=S.bars[Math.floor(m.step/16)],i=m.step%16,tok=bar[2];
  const ch=chordMidis(bar[0],2),arp=chordMidis(bar[0],4);

function musicTick(){
  if(!AC||!music)return;ensureMusicGain();

  if(music.next<AC.currentTime-0.2)music.next=AC.currentTime+0.05;

  }
}

function hatOn(f){return f.id==='pitti'&&!f.hatless&&f.state!=='special';}
function getSprite(f){
  const[k,fn]=poseOf(f),hat=hatOn(f),mir=f.id==='giuso'&&f.face<0,key=f.id+'|'+k+'|'+(hat?1:0)+(mir?'m':'');

function drawFighter(f,x=f.x,y=f.y){
  if(f.inv>0&&!f.dummy&&frame%6<3)return;
  const s=getSprite(f);
  if(f.state==='held'||f.state==='thrown'||f.state==='down'){
    ctx.save();ctx.translate(Math.round(x),Math.round(f.cy));ctx.rotate(f.rot||0);ctx.scale(f.face,1);ctx.drawImage(s.n,-SOX,-SOY+50);ctx.restore();return;}

  ctx.drawImage((f.state==='hit'&&f.t<3&&!f.dummy)?s.w:s.n,-SOX,-SOY);

const GREL={slam:26,suplex:26,toss:32},THROW_DMG=14,THROW_RANGE=42;

function startGrab(f,op){

function aiInput(me,op){
  if(gameMode==='training'&&dummyMode<3){
    if(dummyMode===0)return{};if(dummyMode===1)return{down:true};
    return{up:(frame%70)<3};}
  const D=curDiff();
  const s=me.ai||(me.ai={hold:0,cur:{}});
  if(s.hold>0){s.hold--;return s.cur;}
  const dist=Math.abs(op.x-me.x),tw=op.x>me.x?'right':'left',aw=tw==='right'?'left':'right',r=Math.random();
  const projThreat=projs.some(p=>p.owner===op&&Math.abs(p.x-me.x)<110&&Math.sign(p.vx)===Math.sign(me.x-p.x));
  const threat=(['punch','kick'].includes(op.state)&&op.t<7)||projThreat;
  const canSpec=me.specCd<=0&&!me.hatless;
  const oa=['punch','kick'].includes(op.state)?atkData(op,op.state):null,opRec=!!oa&&op.t>oa.start+oa.act;
  const H=v=>Math.max(1,Math.round(v*D.hold));
  let c={},h=4;
  if(opRec&&dist<62&&r<D.punish){c={[r<D.punish*0.5?'kick':'punch']:true};h=2;}
  else if(!op.onGround&&op.vy>0&&dist<80&&r<D.anti){c={kick:true};h=2;}
  else if(threat&&(dist<120||projThreat)&&r<D.block){c={down:true};h=16;}
  else if(projThreat&&r<D.block+0.15){c={up:true,[tw]:true};h=3;}
  else if(dist>190){if(canSpec&&r<0.08*D.spec){c={special:true};h=2;}else{c={[tw]:true};h=H(8);}}
  else if(dist>58){if(r<0.04){c={up:true,[tw]:true};h=3;}else if(canSpec&&r<0.07*D.spec){c={special:true};h=2;}else{c={[tw]:true};h=H(5);}}
  else{const a=D.atk;if(r<0.30*a){c={punch:true};h=2;}else if(r<0.48*a){c={kick:true};h=2;}else if(r<0.58*a+0.1){c={[aw]:true};h=H(12);}else if(r<0.68*a+0.12){c={down:true};h=10;}else{c={};h=H(7);}}
  if(me.rage>=100&&canSpec&&dist<200&&r<0.1*D.spec){c={special:true};h=2;}
  if(dist<=THROW_RANGE-4&&op.onGround&&Math.random()<(op.state==='block'?0.35:0.06)*D.atk){c={punch:true,[tw]:true};h=2;}
  if(!me.weapon&&settings.weapons&&!threat){const it=items.find(q=>q.landed&&Math.abs(q.x-me.x)<130&&Math.abs(q.y-me.y)<14);
    if(it&&r<0.6){const dx=it.x-me.x;c=Math.abs(dx)<12?{down:true}:{[dx>0?'right':'left']:true};h=Math.abs(dx)<12?3:4;}}
  if(PLATS.length){const dy=op.y-me.y;
    if(dy<-30&&dist<110&&me.onGround&&r<0.3){c={up:true,[tw]:true};h=4;}
    else if(dy>30&&me.plat&&dist<150&&r<0.3){c={down:true,up:true};h=2;}}
  if(op.state==='ko')c={};
  s.cur=c;s.hold=h;return c;
}

function drawProj(p){
  const x=Math.round(p.x),y=Math.round(p.y),c=ctx;
  if(p.type==='burp'){
    const sc=Math.min(1,p.t/12)*(p.t>80?Math.max(0,1-(p.t-80)/30):1);if(sc<=0)return;
    const blobs=[[0,0,11],[-10,4,8],[9,5,8],[-4,-9,7],[7,-7,6],[-14,-4,5],[14,-2,5]];
    for(const pass of [0,1,2])blobs.forEach(([bx,by,r],i)=>{const w=Math.sin(p.t/6+i)*1.5,rr=Math.max(1,(r+w)*sc+(pass===0?1.5:pass===1?0:-r*0.45*sc));

    r(-14,-22-bob,22,11,'#e07a20');r(-14,-22-bob,22,2,'#f4a050');r(-14,-13-bob,22,2,'#a8520f');
    r(-7,-30-bob,11,9,'#e07a20');r(-6,-29-bob,8,6,'#7ab0d8');r(-6,-29-bob,3,2,'#d0ecff');
    r(6,-27-bob,2,6,'#3a3a3a');r(10,-20-bob,3,6,'#2a2a2a');
    c.fillStyle='#140c16';c.beginPath();c.arc(-8,-8,9,0,7);c.fill();c.beginPath();c.arc(8,-5,6,0,7);c.fill();
    c.fillStyle='#2a2a2a';c.beginPath();c.arc(-8,-8,7.5,0,7);c.fill();c.beginPath();c.arc(8,-5,4.5,0,7);c.fill();

    const sp=Math.floor(p.t/3)%2;c.fillStyle='#4a4a4a';c.fillRect(-9+sp,-15,2,2);c.fillRect(-9-sp,-1,2,2);
    c.restore();return;

      c.lineWidth=4;c.strokeStyle='#140c16';c.beginPath();c.arc(x-dir*k*9,y,r,a0,a0+1.8);c.stroke();
      c.lineWidth=2;c.strokeStyle=k===1?'#ffffff':'#ff7ad0';c.beginPath();c.arc(x-dir*k*9,y,r,a0,a0+1.8);c.stroke();}
    if(p.t%6<3){c.fillStyle='#ffd0f0';c.fillRect(x+dir*10,y-14,2,2);c.fillRect(x+dir*6,y+12,2,2);}
    return;
  }
  if(p.type==='desk'){
    c.save();c.translate(x,y);c.rotate(p.t*0.22*Math.sign(p.vx));
    const r=(a,b,w,h,col)=>{c.fillStyle=col;c.fillRect(a,b,w,h);};
    r(-15,-5,30,7,'#140c16');r(-13,1,4,14,'#140c16');r(9,1,4,14,'#140c16');
    r(-12,2,2,12,'#5a6a7a');r(10,2,2,12,'#5a6a7a');r(-12,8,24,1,'#5a6a7a');
    r(-14,-4,28,5,'#8a5a2a');r(-14,-4,28,2,'#c89858');r(-6,-4,6,1,'#e8d0a0');r(6,-1,5,1,'#4a2a10');
    c.restore();return;
  }

  const mlbl={arcade:'ARCADE',versus:'VERSUS CPU',['2p']:'2 GIOCATORI',rissa:'RISSA A 4',training:'ALLENAMENTO'}[gameMode];

  txt(gameMode==='rissa'?'TOCCA A P'+(selStage+1)+'  (CPU: '+(4-rissa.humans)+')':gameMode==='2p'?(selStage===0?'TOCCA A P1':'TOCCA A P2'):'P1 vs CPU ('+DIFFS[settings.diff].name+')',W/2,14,8,selStage===1?'#6fe0ff':'#a99fd6');
  const stp=(W-8)/NC;
  IDS.forEach((id,i)=>{
    const bx=Math.round(4+i*stp),by=26,bw=Math.round(stp-4),bh=60;
    const cur=sel[selStage]===i,locked=sel.slice(0,selStage).includes(i),fl=frame%20<10;
    ctx.fillStyle=cur?(selStage===0?(fl?'#ff4fa3':'#ffd35a'):(fl?'#6fe0ff':'#ffffff')):locked?'#ff4fa3':'#3a3458';
    ctx.fillRect(bx-2,by-2,bw+4,bh+4);
    const g=ctx.createLinearGradient(0,by,0,by+bh);g.addColorStop(0,['#4a1a40','#4a4018','#4a1a1a','#1a3a4a','#2a4a1a','#3a1a4a','#3a3a1a'][i%7]);g.addColorStop(1,'#120e22');ctx.fillStyle=g;ctx.fillRect(bx,by,bw,bh);
    ctx.save();ctx.beginPath();ctx.rect(bx,by,bw,bh);ctx.clip();
    drawFighter(dummy(id,frame+i*7,'idle',1),bx+bw/2-4,by+128);ctx.restore();
    if(!cur&&!locked){ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(bx,by,bw,bh);}
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(bx,by+bh-11,bw,11);
    txtFit(CHARS[id].name,bx+bw/2,by+bh-10,bw-4,cur?'#ffd35a':'#fff');
    if(locked)txt('P'+(sel.indexOf(i)+1),bx+2,by+2,8,'#ff4fa3','left');
    if(cur)txt('P'+(selStage+1),bx+bw-2,by+2,8,selStage===0?'#ffd35a':'#6fe0ff','right');
  });
  // detail panel
  const id=IDS[sel[selStage]],S=STATS[id],C=CHARS[id];
  ctx.fillStyle='rgba(18,14,34,0.92)';ctx.fillRect(4,94,W-8,118);ctx.fillStyle='#3a3458';ctx.fillRect(4,94,W-8,2);
  shadowAt(56,208);drawFighter(dummy(id,frame,frame%120<40?'win':'idle',1),56,208);
  bigText(C.name,250,100,16,'#fff6a0','#e8a010');
  statBar('VITA',S.vita,112,122,'#5ad05a');statBar('FORZA',S.forza,112,133,'#ff6a5a');statBar('VELOC.',S.vel,112,144,'#5ac8ff');
  statBar('DIFESA',S.dif,232,122,'#c8c8d8',72);statBar('SPECIALE',S.spec,232,133,'#ffd35a',72);
  txt('PUNTI VITA: '+C.maxHp,232,144,8,'#8a84a8','left');
  txt('SPECIALE: '+SPEC_LINES[id].join(' '),112,158,8,'#ffd35a','left');
  txt('ABILITA\': '+S.ab,112,172,8,'#ff9ad8','left');
  txtFit(S.desc[0],250,184,250,'#c8c2e8');txtFit(S.desc[1],250,195,250,'#c8c2e8');
}
function renderStage(){
  ctx.fillStyle='rgba(8,6,20,0.55)';ctx.fillRect(0,0,W,H);
  bigText("SCEGLI L'ARENA",W/2,10,16,'#ffffff','#a9b8ff');
  STAGES.forEach((s,i)=>{
    const{x,y,w,h}=stageRect(i),on=stageIdx===i;
    ctx.fillStyle=on?(frame%20<10?'#ffd35a':'#ff4fa3'):'#3a3458';ctx.fillRect(x-3,y-3,w+6,h+6);
    ctx.fillStyle='#000';ctx.fillRect(x-1,y-1,w+2,h+2);
    ctx.drawImage(s.thumb,x,y,w,h);
    if(!on){ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(x,y,w,h);}
    txtFit(s.short||s.name,x+w/2,y+h+6,w+6,on?'#ffd35a':'#a8a2c8');
  });
  txt(gameMode==='rissa'?'RISSA A 4: '+(rissa.variant==='ffa'?'TUTTI CONTRO TUTTI':'2 CONTRO 2'):CHARS[matchIds[0]].name+'  VS  '+CHARS[matchIds[1]].name,W/2,NS>3?182:178,8,'#ffffff');
  if(frame%60<40)txt(isTouch?'TOCCA UN\'ARENA':'A/D SCEGLI - INVIO CONFERMA',W/2,196,8,'#a8a2c8');
}
function toScr(x,y){return WW>576?[Math.round((x-cam)*zoom),Math.round(H-(216-y)*zoom)]:[Math.round(x-cam),Math.round(y)];}
function renderFight(){
  ctx.save();
  if(WW>576){ctx.translate(0,H-216*zoom);ctx.scale(zoom,zoom);ctx.translate(-cam,0);}else ctx.translate(-Math.round(cam),0);
  for(const st of stains){ctx.fillStyle=`rgba(120,10,20,${Math.min(0.75,st.life/300)})`;ctx.fillRect(Math.round(st.x-st.w/2),st.y-1,st.w,2);ctx.fillRect(Math.round(st.x-st.w/2+1),st.y-2,Math.max(1,st.w-2),1);}
  for(const f of fighters)shadowAt(f.x,f.y);
  items.forEach(drawItem);
  const rk=f=>f.state==='ko'?0:(ATK.includes(f.state)||f.state==='grab')?2:1;
  [...fighters].sort((a,b)=>rk(a)-rk(b)).forEach(f=>drawFighter(f));
  projs.forEach(drawProjS);
  for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vy+=0.1;q.life--;ctx.fillStyle=q.c;ctx.fillRect(Math.round(q.x),Math.round(q.y),q.s,q.s);}
  parts=parts.filter(q=>q.life>0);
  drawSparks();
  ctx.restore();
  if(is4())drawHud4();
  else{drawBar(f1,16,false);drawBar(f2,W-176,true);
    ctx.fillStyle='#000';ctx.fillRect(W/2-14,6,28,20);ctx.fillStyle='#c81e1e';ctx.fillRect(W/2-12,8,24,16);txt('KO',W/2+1,12,8,'#ffd35a','center','#5a0a0a');}
  const inf=TIME_OPT[settings.time]===0||gameMode==='training';
  bigText(inf?'--':String(Math.ceil(timer/60)).padStart(2,'0'),W/2,is4()?40:32,16,!inf&&timer<600&&frame%30<15?'#ff8a7a':'#ffffff',!inf&&timer<600?'#c81e1e':'#f0a020');
  if(gameMode==='training'){txt('MANICHINO: '+DUMMY_LBL[dummyMode]+' (T)',W/2,H-12,8,'#9fe0ff');if(trainT>0)txt('DANNO: '+Math.round(trainDmg),W/2,H-24,8,'#ffd35a');}
  if(gameMode==='arcade'&&phase==='intro')txt('SFIDA '+(ladderIdx+1)+'/'+ladder.length,W/2,56,8,'#ffd35a');
  if(is4())drawMarkers();
  if(superFlash>0){ctx.fillStyle=`rgba(255,90,40,${superFlash/40*0.35})`;ctx.fillRect(0,0,W,H);if(superFlash>20)bigText('SUPER!',W/2,90,24,'#fff27a','#ff3a2a');}
  for(const q of pops){q.life--;q.y-=0.25;if(WW>576&&!q.scr)txt(q.s,Math.round(q.x*zoom),Math.round(H-(216-q.y)*zoom),8,q.c);else txt(q.s,q.x,Math.round(q.y),8,q.c);}
  pops=pops.filter(q=>q.life>0);
  if(phase==='intro'&&gameMode!=='training'){
    if(phaseT<70)bigText('ROUND '+round,W/2,78,24,'#ffffff','#9ab0ff');
    else bigText('FIGHT!',W/2,74,32,'#fff27a','#ff3a2a');
  }
  if(phase==='intro'&&gameMode==='training'&&phaseT<100)bigText('ALLENAMENTO',W/2,80,16,'#ffffff','#9ab0ff');
  if(phase==='ko'){
    if(phaseT<100)bigText(koText,W/2,72,32,frame%8<4?'#ffffff':'#fff27a','#ff3a2a');
    else bigText(roundWinner<0?'PAREGGIO':teamName(roundWinner)+' VINCE',W/2,82,16,'#fff6a0','#e8a010');
  }
  if(paused)renderPause();
}
function renderOver(){
  if(is4())return renderOver4();
  ctx.fillStyle='rgba(8,6,20,0.65)';ctx.fillRect(0,0,W,H);
  const w=wins[0]>=winsNeeded()?f1:f2,l=w===f1?f2:f1;
  const ld=dummy(l.id,frame,'ko',-1);ld.koT=99;
  shadowAt(100,GROUND);drawFighter(dummy(w.id,frame,'win',1),100,GROUND);
  drawFighter(ld,330,GROUND);
  bigText('VINCE',262,26,16,'#ffffff','#a9b8ff');
  bigText(w.c.name+'!',262,48,16,'#fff6a0','#e8a010');
  ctx.font='8px "Press Start 2P", monospace';
  const tw=Math.min(W-150,ctx.measureText(overQuote).width+16);
  const bx=Math.max(140,Math.min(W-tw-6,262-tw/2)),by=84;
  ctx.fillStyle='#000';ctx.fillRect(bx-2,by-2,tw+4,24);
  ctx.fillStyle='#fff';ctx.fillRect(bx,by,tw,20);ctx.fillRect(bx-8,by+8,8,4);ctx.fillRect(bx-14,by+12,6,3);
  if(ctx.measureText(overQuote).width>tw-8){ctx.save();ctx.translate(bx+tw/2,by+6);ctx.scale((tw-8)/ctx.measureText(overQuote).width,1);txt(overQuote,0,0,8,'#111','center',null);ctx.restore();}
  else txt(overQuote,bx+tw/2,by+6,8,'#111','center',null);
  if(phaseT>40&&frame%60<42)txt(isTouch?'TOCCA: RIVINCITA':'INVIO RIVINCITA - ESC MENU',262,124,8,'#fff');
}

function renderVS(){
  ctx.fillStyle='rgba(8,6,20,0.7)';ctx.fillRect(0,0,W,H);
  const a=matchIds[0],b=matchIds[1],sl=Math.min(1,phaseT/20);
  ctx.fillStyle='#c8102a';ctx.fillRect(0,40,Math.round(W/2*sl),130);ctx.fillStyle='#1a3aa8';ctx.fillRect(W-Math.round(W/2*sl),40,Math.round(W/2*sl),130);
  shadowAt(90,172);shadowAt(294,172);
  drawFighter(dummy(a,frame,'idle',1),90,172);drawFighter(dummy(b,frame+5,'idle',-1),294,172);
  bigText('VS',W/2,90,32,'#fff27a','#ff3a2a');
  txt(CHARS[a].name,90,176,8,'#fff');txt(CHARS[b].name,294,176,8,'#fff');
  const t=gameMode==='arcade'?'SFIDA '+(ladderIdx+1)+' DI '+ladder.length:'';
  bigText(t,W/2,14,16,'#ffffff','#a9b8ff');
  txt('CPU: '+curDiff().name+'  -  '+STAGES[stageIdx].name,W/2,196,8,'#a8a2c8');
}
function renderContinue(){
  ctx.fillStyle='rgba(8,6,20,0.75)';ctx.fillRect(0,0,W,H);
  const n=Math.max(0,9-Math.floor(phaseT/60));
  drawFighter(dummy(matchIds[0],frame,'hit',1),W/2,170);
  bigText('CONTINUI?',W/2,30,24,'#ffffff','#ff6a5a');
  bigText(String(n),W/2,66,32,'#fff27a','#ff3a2a');
  txt('INVIO: RIPROVA  -  ESC: MENU',W/2,190,8,'#fff');
}
function renderEnding(){
  ctx.fillStyle='rgba(8,6,20,0.7)';ctx.fillRect(0,0,W,H);
  const id=matchIds[0];
  for(let k=0;k<3;k++){ctx.fillStyle=['#ffd35a','#ff5a8a','#5ac8ff'][k];for(let i=0;i<12;i++){const x=(i*37+k*61+frame*(1+k*0.3))%W,y=(i*53+k*29+frame*(1.5+k*0.4))%H;ctx.fillRect(Math.round(x),Math.round(y),3,3);}}
  shadowAt(100,204);drawFighter(dummy(id,frame,'win',1),100,204);
  bigText('CAMPIONE',262,30,16,'#fff6a0','#e8a010');bigText('DEL BAR SPORT!',262,52,16,'#fff6a0','#e8a010');
  txt('HAI BATTUTO TUTTI E '+ladder.length+'!',262,86,8,'#fff');
  txt('DIFFICOLTA\': '+DIFFS[settings.diff].name,262,102,8,'#9fe0ff');txt('CONTINUE USATI: '+continues,262,116,8,'#9fe0ff');
  txt(CHARS[id].quotes[frame%240<120?0:1],262,140,8,'#ffd35a');
  if(phaseT>60&&frame%60<40)txt('INVIO PER TORNARE AL MENU',262,186,8,'#fff');
}

/* ================= LOOP ================= */
let acc=0,last=performance.now();
function loop(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){step();acc-=1000/60;}
  render();requestAnimationFrame(loop);
}
function start(){
  paintStages();
  for(const id of IDS)for(const st of['idle','walk']){const d=dummy(id,0,st);for(let a=0;a<36;a+=3){d.anim=a;getSprite(d);}}
  requestAnimationFrame(loop);
}
if(document.fonts&&document.fonts.load){Promise.race([document.fonts.load('8px "Press Start 2P"'),new Promise(r=>setTimeout(r,1500))]).then(start,start);}else start();
})();
</script>
